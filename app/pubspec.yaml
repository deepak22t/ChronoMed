version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  core_engine:
    path: ../core_engine
  clinical_data:
    path: ../clinical_data
  http: ^1.6.0
